name: Pull request

# Tests the Neon build of testing/version.yaml (.github/workflows/neon-test.yml) and comments the results on the pull
# request.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      neon-repository: ${{ steps.plan.outputs.neon-repository }}
      neon-ref: ${{ steps.plan.outputs.neon-ref }}
      neon-image: ${{ steps.plan.outputs.neon-image }}
      compute-images: ${{ steps.plan.outputs.compute-images }}
      arches: ${{ steps.plan.outputs.arches }}
      tests: ${{ steps.plan.outputs.tests }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: false
          persist-credentials: false

      - name: Read testing/version.yaml
        id: plan
        run: |
          yq -o=json testing/version.yaml > /tmp/version.json
          {
            for key in repository ref image; do
              echo "neon-${key}=$(jq -r ".neon.${key}" /tmp/version.json)"
            done
            echo "compute-images=$(jq -c '[.versions[] | {(.name): .image}] | add' /tmp/version.json)"
            echo "arches=$(jq -c '.arches // ["x64", "arm64"]' /tmp/version.json)"
            echo "tests=$(jq -c '.tests // ["compatibility", "sqlancer", "benchbase"]' /tmp/version.json)"
          } | tee -a "${GITHUB_OUTPUT}"

  test:
    needs: plan
    uses: ./.github/workflows/neon-test.yml
    permissions:
      contents: read
      packages: write
    with:
      neon-repository: ${{ needs.plan.outputs.neon-repository }}
      neon-ref: ${{ needs.plan.outputs.neon-ref }}
      neon-image: ${{ needs.plan.outputs.neon-image }}
      compute-images: ${{ needs.plan.outputs.compute-images }}
      arches: ${{ needs.plan.outputs.arches }}
      tests: ${{ needs.plan.outputs.tests }}
      title: "`testing/version.yaml`"

  comment:
    needs: [ plan, test ]
    # Not for pull requests from forks, whose token can't comment
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: .github/actions

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: neon-test-report
          path: /tmp/report

      - uses: ./.github/actions/comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          marker: "<!-- neon-test -->"
          body-file: /tmp/report/neon-test-report.md
